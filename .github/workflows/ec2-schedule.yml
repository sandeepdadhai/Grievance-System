name: MedNotice India EC2 keep-alive

# The demo instance stays up around the clock. 730 h in a month still fits the
# 750 h/month EC2 free tier for a single t3.micro, and the address only changes
# on a stop/start, so continuous running is both free and the only way the
# http://54.79.127.229/ links keep working.
#
# This workflow is the safety net: every 30 minutes it checks the instance state
# and starts it if it somehow stopped (failed nightly job, manual stop, AWS
# maintenance). GitHub cron is always UTC and can run late, which is why it no
# longer carries the normal day/night switching — a late start used to mean the
# site was unreachable for an hour or more.
#
# The AWS credentials for this account cannot create EventBridge schedules
# (scheduler:*, events:*, iam:PassRole are all denied), so this workflow is the
# external clock. It needs two repository secrets — Settings -> Secrets and
# variables -> Actions:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# The scheduled job is a no-op until they exist (see the guard step).

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:
    inputs:
      action:
        description: "Power action"
        required: true
        default: start
        type: choice
        options: [start, stop]

env:
  AWS_REGION: ap-southeast-2
  INSTANCE_ID: i-07f6a58b57ebf1fb4

jobs:
  power:
    runs-on: ubuntu-latest
    steps:
      - name: Decide the action
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          else
            echo "action=start" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when the AWS secrets are missing
        id: guard
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$KEY" ]; then
            echo "AWS_ACCESS_KEY_ID secret is not set — nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.guard.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start or stop the instance
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Current state: $STATE"
          if [ "${{ steps.decide.outputs.action }}" = "start" ]; then
            if [ "$STATE" = "running" ]; then echo "Already running."; exit 0; fi
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          else
            if [ "$STATE" = "stopped" ]; then echo "Already stopped."; exit 0; fi
            aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
          fi

      - name: Report the public address and health
        if: steps.guard.outputs.ready == 'true' && steps.decide.outputs.action == 'start'
        run: |
          set -euo pipefail
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "MedNotice India is up at http://$IP/" >> "$GITHUB_STEP_SUMMARY"
          if [ "$IP" != "54.79.127.229" ]; then
            {
              echo ""
              echo "⚠️ The public address changed to \`$IP\`. Update \`SSH_HOST\`/\`PUBLIC_URL\`"
              echo "in \`scripts/deploy.sh\` and redeploy, or attach a static Elastic IP."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          for i in $(seq 1 20); do
            if curl -fsS -m 5 "http://$IP/api/health" > /dev/null; then
              echo "Health check OK after $((i * 10))s." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Health check did not pass; the app may still be booting." >> "$GITHUB_STEP_SUMMARY"
